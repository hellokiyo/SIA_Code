<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
</head>
<body>
this is ex-04!
1 ~ 100사이의 숫자를 임의로 생성해둡니다.<br>
사용자로부터 숫자를 입력받아서 그 숫자가 [생성된임의의수]보다 크면 아래 숫자를<br>
입력하게 하고 그 숫자가 생성수보다 작으면 큰 수를 입력하게 하며<br>
같으면 빙고라는 alert창을 띄우고 몇번만에 맞췼는지를 출력합니다.<br>
폼태그를 두고, 그 내부에 인풋박스를 둡니다.<br>
<form>
    <div>
        <p id ="hint">맞춰보시지!</p>
        <input  id ="userNum" type="text" placeholder="숫자를 입력해주세요">
        <input type="button" onclick="myNumber()" value="맞추기">
    </div>

</form>

<script>
    ////

    let cnt = 0;
    let random = Math.floor(Math.random()*100+1)


    function myNumber() {

        let userNum = Number(document.getElementById("userNum").value)

        let hint = document.getElementById("hint")

        if (Number.isNaN(userNum) || userNum < 1 || userNum > 100){
            alert("1~100 숫자를 입력하세요")
        }else {
            cnt++
            if (random !== userNum) {
                if (random > userNum) {
                    hint.innerHTML = "업!"
                } else if (random < userNum) {
                    hint.innerHTML = "다운!"
                }
            } else if (random === userNum) {
                alert(cnt + "번만에 맞췄습니다!")
                hint.innerHTML = "정답!"
            }
        }
    }
</script>
</body>
</html>
